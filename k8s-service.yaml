apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: toctou-skaffold-svc
spec:
  template:
    spec:
      containers:
        - image: us-docker.pkg.dev/cloudrun/container/hello
          env:
            - name: MARKER
              value: "SKAFFOLD_GIT_EVIL_REPLACED_TOCTOU_PROOF"
            - name: EVIL_ENV
              value: "INJECTED_BY_ATTACKER"
